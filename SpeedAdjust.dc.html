<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Machine speed popup</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1024px; height: 600px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 16px; background: rgba(30, 35, 40, 0.55); font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1E2328">

<sc-if value="{{visible}}" hint-placeholder-val="{{ true }}">
<section role="dialog" aria-label="Machine speed" style="width: 560px; box-sizing: border-box; padding: 16px 20px; background: #F4F5F6; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35)">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 20px; font-weight: 600">Machine speed</h1>
<button type="button" onClick="{{close}}" aria-label="Close" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: #3A4148; cursor: pointer"><svg style="pointer-events: none" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="height: 48px; padding: 0 14px; box-sizing: border-box; background: #E4E6E8; border-radius: 6px; display: flex; align-items: center; justify-content: space-between"><span style="font-size: 14px; color: #3A4148">Recipe speed</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">{{recipeText}} units/min</span></div>

<div style="display: flex; align-items: center; gap: 10px">
<button type="button" onClick="{{dec}}" aria-label="Decrease speed by 1" style="width: 72px; height: 72px; border: 1px solid #A7AEB5; border-radius: 6px; background: #FFFFFF; color: #1E2328; font-family: inherit; font-size: 28px; cursor: pointer">−</button>
<button type="button" onClick="{{openPad}}" aria-label="Speed {{valueText}} units per minute. Tap to type a value" style="flex: 1; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; background: #FFFFFF; border: 2px solid #1F5FA8; border-radius: 6px; font-family: inherit; color: #1E2328; cursor: text">
<span style="display: flex; align-items: baseline; gap: 6px; pointer-events: none"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 600">{{valueText}}</span><sc-if value="{{editing}}" hint-placeholder-val="{{ false }}"><span style="align-self: center; width: 2px; height: 30px; background: #1F5FA8"></span></sc-if><span style="font-size: 16px; color: #4A525A">units/min</span></span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A525A; pointer-events: none">{{subText}}</span>
</button>
<button type="button" onClick="{{inc}}" aria-label="Increase speed by 1" style="width: 72px; height: 72px; border: 1px solid #A7AEB5; border-radius: 6px; background: #FFFFFF; color: #1E2328; font-family: inherit; font-size: 28px; cursor: pointer">+</button>
</div>

<div style="display: flex; align-items: center; gap: 10px; padding: 0 0 0 14px; background: #E4E6E8; border-radius: 6px">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">Jog speed</span><span style="font-size: 12px; color: #3A4148">for the physical jog button · 1–15</span></span>
<button type="button" onClick="{{jogDec}}" aria-label="Decrease jog speed" style="width: 56px; height: 52px; border: 1px solid #A7AEB5; border-radius: 6px; background: #FFFFFF; color: #1E2328; font-family: inherit; font-size: 24px; cursor: pointer">−</button>
<span style="width: 92px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600">{{jogText}}<span style="font-size: 12px; font-weight: 400; color: #4A525A"> /min</span></span>
<button type="button" onClick="{{jogInc}}" aria-label="Increase jog speed" style="width: 56px; height: 52px; border: 1px solid #A7AEB5; border-radius: 6px; background: #FFFFFF; color: #1E2328; font-family: inherit; font-size: 24px; cursor: pointer">+</button>
</div>

<div style="display: flex; gap: 10px">
<button type="button" onClick="{{close}}" style="flex: 1; height: 60px; border: 1px solid #A7AEB5; border-radius: 6px; background: #FFFFFF; color: #1E2328; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">Cancel</button>
<button type="button" onClick="{{confirm}}" style="flex: 1; height: 60px; border: 0; border-radius: 6px; background: #1F5FA8; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Apply</button>
</div>
</section>
</sc-if>
<sc-if value="{{closedView}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{reopen}}" style="margin: auto; height: 64px; padding: 0 28px; border: 0; border-radius: 6px; background: #1F5FA8; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Open machine speed popup</button>
</sc-if>

<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Number keypad" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 6px 160px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; background: #C5CACF">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="14">
<button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" style="grid-column: {{k.span}}; height: 44px; border: 0; border-radius: 6px; background: {{k.bg}}; color: {{k.fg}}; font-family: 'IBM Plex Mono', monospace; font-size: {{k.size}}; font-weight: 600; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); cursor: pointer">{{k.label}}</button>
</sc-for>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"onConfirm":{"editor":null},"current":{"editor":null},"recipe":{"editor":null},"jog":{"editor":null},"$preview":{"width":1024,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const base = typeof this.props.current === 'number' ? this.props.current : 43;
    const recipe = typeof this.props.recipe === 'number' ? this.props.recipe : 45;
    const LO = 10, HI = 60;
    const v = typeof st.v === 'number' ? st.v : base;
    const jogBase = typeof this.props.jog === 'number' ? this.props.jog : 6;
    const jv = typeof st.jv === 'number' ? st.jv : jogBase;
    const editing = typeof st.entry === 'string';
    const entry = st.entry || '';
    const clamp = (x) => Math.min(HI, Math.max(LO, x));
    const reset = { v: undefined, entry: undefined, jv: undefined };
    const close = () => { this.setState(reset); if (this.props.onClose) this.props.onClose(); else this.setState({ hidden: true }); };
    const commitEntry = () => { const n = parseInt(entry, 10); this.setState({ v: isNaN(n) ? v : clamp(n), entry: undefined }); };
    const confirm = () => {
      let out = v;
      if (editing) { const n = parseInt(entry, 10); if (!isNaN(n)) out = clamp(n); }
      this.setState(reset);
      if (this.props.onConfirm) this.props.onConfirm(out, jv); else this.setState({ hidden: true });
    };
    const type = (d) => { if (entry.length < 2) this.setState({ entry: entry + d }); };
    const labels = ['7', '8', '9', '⌫', '4', '5', '6', 'Clear', '1', '2', '3', '0'];
    const keys = labels.map((l) => {
      let press;
      if (l === '⌫') press = () => this.setState({ entry: entry.slice(0, -1) });
      else if (l === 'Clear') press = () => this.setState({ entry: '' });
      else press = () => type(l);
      const fn = l === '⌫' || l === 'Clear';
      return { label: l, aria: l === '⌫' ? 'Delete last digit' : l, press: press, bg: fn ? '#A7AEB5' : '#FFFFFF', fg: '#1E2328', size: l === 'Clear' ? '15px' : '20px', span: 'span 1' };
    });
    keys.push({ label: 'Cancel', aria: 'Close keypad', press: () => this.setState({ entry: undefined }), bg: '#A7AEB5', fg: '#1E2328', size: '15px', span: 'span 2' });
    keys.push({ label: 'Done', aria: 'Done', press: commitEntry, bg: '#1F5FA8', fg: '#FFFFFF', size: '16px', span: 'span 2' });
    const shown = editing ? (entry || '') : String(v);
    const n = editing ? parseInt(entry, 10) : v;
    let sub;
    if (editing) sub = entry ? (n < LO || n > HI ? 'outside ' + LO + '–' + HI + ', will be limited' : 'press Done to use ' + n) : 'type a value';
    else sub = v === recipe ? 'same as recipe' : (v > recipe ? '+' : '−') + Math.abs(v - recipe) + ' from recipe';
    return {
      close: close,
      confirm: confirm,
      inc: () => this.setState({ v: clamp(v + 1), entry: undefined }),
      jogText: String(jv),
      jogDec: () => this.setState({ jv: Math.max(1, jv - 1) }),
      jogInc: () => this.setState({ jv: Math.min(15, jv + 1) }),
      dec: () => this.setState({ v: clamp(v - 1), entry: undefined }),
      openPad: () => this.setState({ entry: '' }),
      editing: editing,
      keys: keys,
      valueText: shown,
      subText: sub,
      recipeText: String(recipe),
      visible: !st.hidden,
      closedView: !!st.hidden,
      reopen: () => this.setState({ hidden: false })
    };
  }
}
</script>
</body>
</html>
