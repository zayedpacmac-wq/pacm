<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in popup</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1024px; height: 600px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 16px; background: rgba(30, 35, 40, 0.55); font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1E2328">

<sc-if value="{{visible}}" hint-placeholder-val="{{ true }}">
<section role="dialog" aria-label="Log in" style="width: 760px; box-sizing: border-box; padding: 14px 20px 18px; background: #F4F5F6; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35)">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 20px; font-weight: 600">Log in</h1>
<button type="button" onClick="{{close}}" aria-label="Close" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: #3A4148; cursor: pointer"><svg style="pointer-events: none" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<span style="font-size: 13px; color: #3A4148">User name</span>
<button type="button" onClick="{{focusUser}}" aria-label="User name" style="height: 56px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; border: {{userBorder}}; border-radius: 6px; background: #FFFFFF; font-family: inherit; font-size: 17px; text-align: left; cursor: text"><span style="color: {{userColor}}">{{userText}}</span><sc-if value="{{userFocus}}" hint-placeholder-val="{{ false }}"><span style="width: 2px; height: 26px; margin-left: 2px; background: #1F5FA8"></span></sc-if></button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<span style="font-size: 13px; color: #3A4148">Password</span>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{focusPass}}" aria-label="Password" style="flex: 1; height: 56px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; border: {{passBorder}}; border-radius: 6px; background: #FFFFFF; font-family: inherit; font-size: 17px; letter-spacing: {{passSpacing}}; text-align: left; cursor: text"><span style="color: {{passColor}}">{{passText}}</span><sc-if value="{{passFocus}}" hint-placeholder-val="{{ false }}"><span style="width: 2px; height: 26px; margin-left: 2px; background: #1F5FA8"></span></sc-if></button>
<button type="button" onClick="{{toggleShow}}" style="width: 80px; height: 56px; border: 1px solid #A7AEB5; border-radius: 6px; background: #FFFFFF; color: #1E2328; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{showLabel}}</button>
</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px">
<span style="flex: 1; font-size: 12px; color: #4A525A">Account locks after 3 wrong attempts.</span>
<button type="button" onClick="{{close}}" style="width: 150px; height: 60px; border: 1px solid #A7AEB5; border-radius: 6px; background: #FFFFFF; color: #1E2328; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">Cancel</button>
<sc-if value="{{canLogin}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{confirm}}" style="width: 220px; height: 60px; border: 0; border-radius: 6px; background: #1F5FA8; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Log in</button></sc-if>
<sc-if value="{{cannotLogin}}" hint-placeholder-val="{{ true }}"><button type="button" disabled style="width: 220px; height: 60px; border: 0; border-radius: 6px; background: #C5CACF; color: #3A4148; font-family: inherit; font-size: 16px; font-weight: 600">Log in</button></sc-if>
</div>
</section>
</sc-if>
<sc-if value="{{closedView}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{reopen}}" style="margin: auto; height: 64px; padding: 0 28px; border: 0; border-radius: 6px; background: #1F5FA8; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Open log in popup</button>
</sc-if>

<sc-if value="{{kbOpen}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="On-screen keyboard" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 8px; display: flex; flex-direction: column; gap: 6px; background: #C5CACF">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
<div style="display: flex; gap: 6px">
<sc-for list="{{row.keys}}" as="k" hint-placeholder-count="10">
<button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" style="flex: {{k.flex}}; height: 50px; border: 0; border-radius: 6px; background: {{k.bg}}; color: {{k.fg}}; font-family: inherit; font-size: {{k.size}}; font-weight: 500; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); cursor: pointer">{{k.label}}</button>
</sc-for>
</div>
</sc-for>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"onConfirm":{"editor":null},"$preview":{"width":1024,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const user = st.user || '';
    const pass = st.pass || '';
    const focus = st.focus || null;
    const shift = !!st.shift;
    const show = !!st.show;
    const canLogin = user.length > 0 && pass.length > 0;
    const setField = (f, v) => this.setState(f === 'user' ? { user: v } : { pass: v });
    const type = (ch) => {
      if (!focus) return;
      const cur = focus === 'user' ? user : pass;
      if (cur.length >= 24) return;
      setField(focus, cur + ch);
      if (shift) this.setState({ shift: false });
    };
    const back = () => {
      if (!focus) return;
      const cur = focus === 'user' ? user : pass;
      setField(focus, cur.slice(0, -1));
    };
    const reset = { user: '', pass: '', focus: null, shift: false, show: false };
    const close = () => { if (this.props.onClose) { this.setState(reset); this.props.onClose(); } else { this.setState(Object.assign({}, reset, { hidden: true })); } };
    const confirm = () => { if (!canLogin) return; if (this.props.onConfirm) { this.setState(reset); this.props.onConfirm(); } else { this.setState(Object.assign({}, reset, { hidden: true })); } };
    const mk = (ch) => {
      const c = shift ? ch.toUpperCase() : ch;
      return { label: c, aria: c, flex: '1', bg: '#FFFFFF', fg: '#1E2328', size: '20px', press: () => type(c) };
    };
    const fn = (label, aria, flex, press, bg, fg) => ({ label: label, aria: aria, flex: flex, bg: bg || '#A7AEB5', fg: fg || '#1E2328', size: '16px', press: press });
    const enter = focus === 'user'
      ? fn('Next', 'Next field', '2', () => this.setState({ focus: 'pass' }), '#1F5FA8', '#FFFFFF')
      : fn('Log in', 'Log in', '2', confirm, canLogin ? '#1F5FA8' : '#E4E6E8', canLogin ? '#FFFFFF' : '#4A525A');
    const rows = [
      { keys: '1234567890'.split('').map(mk) },
      { keys: 'qwertyuiop'.split('').map(mk) },
      { keys: 'asdfghjkl.'.split('').map(mk) },
      { keys: [fn(shift ? '⇧ on' : '⇧', 'Shift', '1.5', () => this.setState({ shift: !shift }), shift ? '#1F5FA8' : '#A7AEB5', shift ? '#FFFFFF' : '#1E2328')]
          .concat('zxcvbnm'.split('').map(mk))
          .concat([fn('⌫', 'Delete', '1.5', back)]) },
      { keys: [fn('Hide', 'Hide keyboard', '1.5', () => this.setState({ focus: null })),
               fn('space', 'Space', '5', () => type(' '), '#FFFFFF'),
               enter] }
    ];
    return {
      rows: rows,
      visible: !st.hidden,
      closedView: !!st.hidden,
      reopen: () => this.setState({ hidden: false }),
      kbOpen: !!focus && !st.hidden,
      kbClosed: !focus,
      justify: focus ? 'flex-start' : 'center',
      padTop: focus ? '12px' : '0px',
      userText: user || 'Enter user name',
      userColor: user ? '#1E2328' : '#5F6872',
      userBorder: focus === 'user' ? '2px solid #1F5FA8' : '1px solid #A7AEB5',
      userFocus: focus === 'user',
      passText: pass ? (show ? pass : '●'.repeat(pass.length)) : 'Enter password',
      passColor: pass ? '#1E2328' : '#5F6872',
      passSpacing: pass && !show ? '4px' : '0px',
      passBorder: focus === 'pass' ? '2px solid #1F5FA8' : '1px solid #A7AEB5',
      passFocus: focus === 'pass',
      showLabel: show ? 'Hide' : 'Show',
      toggleShow: () => this.setState({ show: !show }),
      focusUser: () => this.setState({ focus: 'user' }),
      focusPass: () => this.setState({ focus: 'pass' }),
      canLogin: canLogin,
      cannotLogin: !canLogin,
      close: close,
      confirm: confirm
    };
  }
}
</script>
</body>
</html>
